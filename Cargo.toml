[workspace]
members = [
    "oyta-content",
    "oyta-router",
    "oyta-expert",
    "oyta-fusion",
    "oyta-autograd",
    "oyta-loss",
    "oyta-optim",
    "oyta-trainer",
    "oyta-serialize",
    ".",
]
resolver = "2"

# ===== workspace 统一管理 package 元数据 =====
[workspace.package]
version = "0.1.0"
edition = "2024"

# ===== workspace 统一管理所有依赖版本（子 crate 只写 workspace = true）=====
[workspace.dependencies]
# 底层算子引擎（registry）
oyta-tensor    = "0.1.1"
# 框架层内部 crate（workspace path）
oyta-content   = { path = "oyta-content" }
oyta-router    = { path = "oyta-router" }
oyta-expert    = { path = "oyta-expert" }
oyta-fusion    = { path = "oyta-fusion" }
oyta-autograd  = { path = "oyta-autograd" }
oyta-loss      = { path = "oyta-loss" }
oyta-optim     = { path = "oyta-optim" }
oyta-trainer   = { path = "oyta-trainer" }
oyta-serialize = { path = "oyta-serialize" }
# 通用工具（所有 crate 共享版本）
serde          = { version = "1.0.229", features = ["derive"] }
serde_json     = "1.0.152"
regex          = "1.11.1"
rayon          = "1.12.0"
thiserror      = "2.0.16"
anyhow         = "1.0.93"
# 测试工具（dev-dependency，解决全局状态 race condition）
serial_test    = "4.0.1"

# ===== 顶层纯 Lib crate（公共 API 入口，一行 prelude 导入全部）=====
[package]
name = "oyta_frame"
version.workspace = true
edition.workspace = true

# ===== 顶层 crate 依赖：覆盖全部 9 个框架 crate =====
[dependencies]
# 底层算子引擎（registry 版本）
oyta-tensor    = { workspace = true }
# 框架层 9 个内部 crate（workspace path 依赖）
oyta-content   = { workspace = true }
oyta-router    = { workspace = true }
oyta-expert    = { workspace = true }
oyta-fusion    = { workspace = true }
oyta-autograd  = { workspace = true }
oyta-loss      = { workspace = true }
oyta-optim     = { workspace = true }
oyta-trainer   = { workspace = true }
oyta-serialize = { workspace = true }
