[workspace]
members = [
    "oyta-content",
    "oyta-router",
    "oyta-expert",
    "oyta-fusion",
    "oyta-autograd",
    "oyta-loss",
    "oyta-optim",
    "oyta-trainer",
    "oyta-serialize",
    ".",
]
resolver = "2"

# ===== workspace 统一管理所有 crate 共享元数据 =====
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/oytaer/oyta_frame"

# ===== workspace 统一管理所有依赖版本 =====
# 内部 crate：path + version 双轨声明
#   - 本地开发时 cargo 用 path（workspace 内即时编译）
#   - 发布到 crates.io 时 cargo 用 version（registry 解析）
[workspace.dependencies]
# 底层算子引擎（registry）
oyta-tensor    = "0.1.1"
# 框架层内部 crate（path + version 双轨）
oyta-content   = { path = "oyta-content", version = "0.1.0" }
oyta-router    = { path = "oyta-router", version = "0.1.0" }
oyta-expert    = { path = "oyta-expert", version = "0.1.0" }
oyta-fusion    = { path = "oyta-fusion", version = "0.1.0" }
oyta-autograd  = { path = "oyta-autograd", version = "0.1.0" }
oyta-loss      = { path = "oyta-loss", version = "0.1.0" }
oyta-optim     = { path = "oyta-optim", version = "0.1.0" }
oyta-trainer   = { path = "oyta-trainer", version = "0.1.0" }
oyta-serialize = { path = "oyta-serialize", version = "0.1.0" }
# 通用工具
serde          = { version = "1.0.229", features = ["derive"] }
serde_json     = "1.0.152"
regex          = "1.11.1"
rayon          = "1.12.0"
thiserror      = "2.0.16"
anyhow         = "1.0.93"
# 测试工具（dev-dependency，解决全局 training_mode race condition）
serial_test    = "4.0.1"

# ===== 顶层 oyta_frame crate（公共 API 入口）=====
[package]
name = "oyta_frame"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# 顶层 crate 独立描述
description = "生产环境稀疏 MoE 训练框架 — 一行 prelude 导入全部 9 个子 crate 的公共 API。agpl-3.0-or-later 开源，商用需单独授权。"
keywords = ["ai", "deep-learning", "moe", "sparse", "trainer", "autograd"]
categories = ["science::machine-learning", "algorithms"]

# ===== 顶层 crate 依赖全部 9 个框架子 crate =====
[dependencies]
oyta-tensor    = { workspace = true }
oyta-content   = { workspace = true }
oyta-router    = { workspace = true }
oyta-expert    = { workspace = true }
oyta-fusion    = { workspace = true }
oyta-autograd  = { workspace = true }
oyta-loss      = { workspace = true }
oyta-optim     = { workspace = true }
oyta-trainer   = { workspace = true }
oyta-serialize = { workspace = true }
